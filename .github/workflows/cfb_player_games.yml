name: CFB Player Game Stats

# Pulls CFBD player box scores a week at a time into cfb_player_game_boxes
# (raw) and cfb_player_game_stats (DraftKings points), which feed the CFB DFS
# page's projections. Only weeks whose every game is final are fetched
# (--complete-only), so a live box score never lands as history. Re-fetching a
# finished week is an idempotent upsert: a few CFBD calls a day.
on:
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons, space separated (blank = current season)"
        required: false
        default: ""
        type: string

concurrency:
  group: cfb-player-games
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest player box scores
        run: |
          # A college season spans New Year: January and February belong to last year's season.
          year=$(date -u +%Y); month=$(date -u +%m)
          current=$year; if [ "$month" -le 2 ]; then current=$((year - 1)); fi
          seasons="${{ inputs.seasons }}"; [ -z "$seasons" ] && seasons="$current"
          for season in $seasons; do
            if [ "$season" = "$current" ]; then
              python -m ingest.cfb_player_games --season "$season" --weeks 1-16 --complete-only
            else
              python -m ingest.cfb_player_games --season "$season" --weeks 1-16 --postseason
            fi
          done
