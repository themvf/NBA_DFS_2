name: Refresh NFL DFS Post-Week Review

# Everything that can be produced about last week's slates WITHOUT anyone
# typing a command.
#
# What runs here:
#   1. the results phase of the daily pipeline (`ingest.nfl_dfs_weekly --phase
#      results`): refresh the schedule, download nflverse's current player-week
#      and team-week stats, store them, and score them into
#      `nfl_dfs_player_week_results` (where the play-by-play DST components
#      land). Until 2026-09-29 this job only RE-SCORED rows already stored, so
#      it could never score a game the projections workflow had not fetched --
#      Monday night's PHI@CHI sat at zero result rows while the run went green;
#   2. a coverage check that names every completed game still not scorable
#      (warning while nflverse may still be publishing, error once it is
#      GRACE_HOURS old -- see ingest/nfl_dfs_results_coverage.py);
#   3. the slate-scoped report cards, which grade our projections against what
#      DraftKings actually paid;
#   4. the field-ownership audit over whatever contests have been imported.
#   5. the weekly replacement-upside grade (second job, below), pre-registered
#      in docs/nfl-replacement-upside-grading.md. Blinded until its floors are
#      met; the first run past them freezes the verdict in the database.
#
# What does NOT run here, and cannot:
#   getting the DraftKings contest standings export. DraftKings gates it behind
#   the account that entered the contest, so no token in this repo can fetch
#   it. That one file is dropped into the NFL workspace ("What the field knew"
#   panel), which parses it in the browser and persists the ownership. This
#   job then keeps the audit current from that point on, and re-running it is
#   free -- the audit is recomputed from stored ownership, never cached.
#
# Slots, against nflverse's publish cadence:
#   Tuesday 10:07 UTC = Sunday's games are published by then. Monday night's
#                       game usually is NOT: on 2026-09-29 nflverse's player-
#                       and team-week stats for PHI@CHI landed at 11:34 UTC,
#                       after this slot. The coverage check reports it as
#                       pending (a warning, not a failure) and a later pass
#                       scores it.
#   Wednesday 10:07 UTC = a second pass: scores Monday night and picks up late
#                         nflverse corrections. The results ledger is
#                         append-only and keyed by input digest, so an
#                         unchanged week inserts nothing.
# Those two slots are dispatched by Vercel Cron (/api/cron/dispatch, job
# nfl-dfs-postweek): GitHub's own schedule has skipped slots on this repo.
# The schedule below is the fallback, later the same days (14:41 UTC, after
# nflverse's Monday-night publish); every step is idempotent, so a second pass
# costs minutes and changes nothing.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to refresh (e.g. 2026). Blank = the current target season."
        required: false
        default: ""
  schedule:
    - cron: "41 14 * * 2,3"   # fallback only; see the note above

concurrency:
  group: nfl-dfs-postweek
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEASON: ${{ inputs.season }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fetch, store and score the week: the same results phase the
      # projections workflow runs. It refreshes the schedule (so a finished
      # Monday-night game is marked completed), downloads nflverse's current
      # player-week and team-week stats, writes them to ff_player_week_stats,
      # and materializes realized DK points. DST components come from
      # play-by-play when it is present and fall back to the team-week
      # aggregate when it is not. A malformed feed or a failed schedule health
      # gate fails this step visibly. Blank season = the pipeline's own rule
      # (before April, last year's season).
      - name: Fetch, store and score the week's results
        id: results
        run: python -m ingest.nfl_dfs_weekly --phase results ${SEASON:+--season "$SEASON"}

      # The results phase can succeed and still leave a game unscored (nflverse
      # not yet published, or a whole team failing identity). Name every such
      # game: a warning while it is recent, an error once it is overdue.
      - name: Check every completed game is scorable
        if: ${{ !cancelled() }}
        run: python -m ingest.nfl_dfs_results_coverage ${SEASON:+--season "$SEASON"}

      # How far our projections were from what DraftKings paid, per completed
      # slate upload. Scored on the players DK listed, so the zero a listed
      # absentee was paid counts -- but only in games whose player feed has
      # landed. Runs even if the fetch failed: it grades whatever is stored.
      - name: Slate report cards
        if: ${{ !cancelled() }}
        run: python -m ingest.nfl_dfs_slate_reportcard --pooled

      # What the field knew that we did not, over every contest already
      # imported. Prints nothing useful until a contest export has been
      # uploaded, and says so rather than failing.
      - name: Field-ownership audit
        if: ${{ !cancelled() }}
        run: python -m ingest.nfl_dfs_field_audit --report

      # The run log is the record. Kept so a week can be read back without
      # re-running anything, and so a change in the numbers has a dated
      # before/after rather than only a current value.
      - name: Save the review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-dfs-postweek-review
          path: |
            artifacts/**
          if-no-files-found: ignore
          retention-days: 90

  # The weekly replacement-upside grade (nfl-replacement-upside-grade-v1).
  # Runs after the review even if one of its steps failed: the grade reads only
  # results that exist, and blocking it on an unrelated report-card failure is
  # the health-gate mistake recorded in CLAUDE.md.
  grade-replacement-upside:
    needs: review
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `npm install`, not `npm ci`: see run_nfl_cash_optimizer.yml.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Refuse to grade if the gate's own logic or frozen constants are broken.
      - name: Verify the registered gate
        run: npm run test:nfl-replacement-upside-grade
      - name: Grade
        run: |
          mkdir -p ../artifacts
          npm run grade:nfl-replacement-upside -- --out ../artifacts/nfl_replacement_upside_grade_latest.json
      - name: Save the grade report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-replacement-upside-grade
          path: artifacts/nfl_replacement_upside_grade_latest.json
          if-no-files-found: ignore
          retention-days: 90
