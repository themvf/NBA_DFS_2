name: Refresh NFL DFS Post-Week Review

# Everything that can be produced about last week's slates WITHOUT anyone
# typing a command.
#
# What runs here:
#   1. the results phase of the daily pipeline (`ingest.nfl_dfs_weekly --phase
#      results`): refresh the schedule, download nflverse's current player-week
#      and team-week stats, store them, and score them into
#      `nfl_dfs_player_week_results` (where the play-by-play DST components
#      land). Until 2026-09-29 this job only RE-SCORED rows already stored, so
#      it could never score a game the projections workflow had not fetched --
#      Monday night's PHI@CHI sat at zero result rows while the run went green;
#   2. a coverage check that names every completed game still not scorable
#      (warning while nflverse may still be publishing, error once it is
#      GRACE_HOURS old -- see ingest/nfl_dfs_results_coverage.py);
#   3. the slate-scoped report cards, which grade our projections against what
#      DraftKings actually paid;
#   4. the field-ownership audit over whatever contests have been imported.
#   5. the weekly replacement-upside grade (second job, below), pre-registered
#      in docs/nfl-replacement-upside-grading.md. Blinded until its floors are
#      met; the first run past them freezes the verdict in the database.
#
# What does NOT run here, and cannot:
#   getting the DraftKings contest standings export. DraftKings gates it behind
#   the account that entered the contest, so no token in this repo can fetch
#   it. That one file is dropped into the NFL workspace ("What the field knew"
#   panel), which parses it in the browser and persists the ownership. This
#   job then keeps the audit current from that point on, and re-running it is
#   free -- the audit is recomputed from stored ownership, never cached.
#
# Slots, against nflverse's publish cadence (owner's decision 2026-10-19):
#   Monday 13:07 UTC  = Thursday and Sunday, Sunday night included, are
#                       published by then (SNF was in nflverse by Monday
#                       morning on 2026-10-19). Monday night is not played yet:
#                       the coverage check reports it pending and the flagship
#                       review takes only finished game days.
#   Tuesday 14:07 UTC = a second pass: scores Monday night (nflverse landed
#                       PHI@CHI at 11:34 UTC on 2026-09-29) and picks up late
#                       corrections. The results ledger is append-only and
#                       keyed by input digest, so an unchanged week inserts
#                       nothing.
# Those two slots are dispatched by Vercel Cron (/api/cron/dispatch, job
# nfl-dfs-postweek): GitHub's own schedule has skipped slots on this repo.
# The schedule below is the fallback, later the same days (14:41 UTC); every
# step is idempotent, so a second pass costs minutes and changes nothing.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to refresh (e.g. 2026). Blank = the current target season."
        required: false
        default: ""
  schedule:
    - cron: "41 14 * * 1,2"   # fallback only; see the note above

concurrency:
  group: nfl-dfs-postweek
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEASON: ${{ inputs.season }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fetch, store and score the week: the same results phase the
      # projections workflow runs. It refreshes the schedule (so a finished
      # Monday-night game is marked completed), downloads nflverse's current
      # player-week and team-week stats, writes them to ff_player_week_stats,
      # and materializes realized DK points. DST components come from
      # play-by-play when it is present and fall back to the team-week
      # aggregate when it is not. A malformed feed or a failed schedule health
      # gate fails this step visibly. Blank season = the pipeline's own rule
      # (before April, last year's season).
      - name: Fetch, store and score the week's results
        id: results
        run: python -m ingest.nfl_dfs_weekly --phase results ${SEASON:+--season "$SEASON"}

      # The results phase can succeed and still leave a game unscored (nflverse
      # not yet published, or a whole team failing identity). Name every such
      # game: a warning while it is recent, an error once it is overdue.
      - name: Check every completed game is scorable
        if: ${{ !cancelled() }}
        run: python -m ingest.nfl_dfs_results_coverage ${SEASON:+--season "$SEASON"}

      # How far our projections were from what DraftKings paid, per completed
      # slate upload. Scored on the players DK listed, so the zero a listed
      # absentee was paid counts -- but only in games whose player feed has
      # landed. Runs even if the fetch failed: it grades whatever is stored.
      - name: Slate report cards
        if: ${{ !cancelled() }}
        run: python -m ingest.nfl_dfs_slate_reportcard --pooled

      # What the field knew that we did not, over every contest already
      # imported. Prints nothing useful until a contest export has been
      # uploaded, and says so rather than failing.
      - name: Field-ownership audit
        if: ${{ !cancelled() }}
        run: python -m ingest.nfl_dfs_field_audit --report

      # The week's free flagship contests from stat-api (the Millionaire, the
      # biggest Thursday and Monday showdown: full standings and the top 100
      # finishers' every lineup, no key needed), then the winners-versus-us
      # review against the optimizer run saved for each slate, stored in
      # nfl_dfs_field_build_reviews. A contest stat-api does not serve in full
      # is named and skipped, never stored as a preview. Runs even if an
      # earlier step failed: it reads only what is stored.
      - name: Flagship contests and the winners-vs-us review
        if: ${{ !cancelled() }}
        run: python -m ingest.nfl_dfs_flagship_review ${SEASON:+--season "$SEASON"}

      # The ghost-lineup factorial (docs/nfl-ghost-factorial-study.md): grade
      # the house, every arm and any owner build of each frozen slate against
      # the flagship just imported, then write the weekly report (factor
      # effects only at the registered 8-slate milestone). After the import,
      # because it reads the contest's score curve and payout table.
      - name: Grade the ghost-lineup factorial
        if: ${{ !cancelled() }}
        run: python -m research.nfl_ghost_grade

      # Keep storage bounded (ingest/nfl_dfs_storage.py): for weeks whose
      # games are all final and two days old, delete projection runs nothing
      # references (slates, optimizer runs, study pins, the forecasts report
      # cards grade, the last run before each kickoff), and keep the newest
      # two weekly report cards. ~30 runs a day otherwise accumulate for good.
      # No VACUUM FULL here: it locks the tables; normal vacuum reuses space.
      - name: Prune finished weeks' unreferenced projection runs
        if: ${{ !cancelled() }}
        run: python -m ingest.nfl_dfs_storage retention reportcards --apply ${SEASON:+--season "$SEASON"}

      # The run log is the record. Kept so a week can be read back without
      # re-running anything, and so a change in the numbers has a dated
      # before/after rather than only a current value.
      - name: Save the review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-dfs-postweek-review
          path: |
            artifacts/**
          if-no-files-found: ignore
          retention-days: 90

  # The weekly player-prop under grade (nfl-prop-under-v1, docs/nfl-prop-under-study.md).
  # Independent of the review job's report cards for the same reason as the
  # upside grade below: it reads only the nflverse file and the stored pricing.
  grade-prop-under:
    needs: review
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      # Refuse to grade if the frozen constants or the model pins are broken.
      - name: Verify the registered study
        run: python -m pytest -q tests/test_nfl_prop_under_study.py
      - name: Grade
        run: |
          mkdir -p artifacts
          python -m research.nfl_prop_under_study grade --write-db --out artifacts/nfl_prop_under_grade_latest.json
      # v2 (2026-10-18): the same rules re-registered on the roles-v2 game-leaders
      # model; v1 ended at the model amendment with one game week.
      - name: Grade v2
        if: ${{ !cancelled() }}
        run: |
          python -m research.nfl_prop_under_study grade --write-db --registration docs/nfl-prop-under-study-v2.json --out artifacts/nfl_prop_under_v2_grade_latest.json
      # nfl-prop-under-role-change-v1 (docs/nfl-prop-under-role-change-study.md):
      # v2's flagged unders split by a teammate's fresh absence. Read-only on v2.
      - name: Verify the role-change study
        if: ${{ !cancelled() }}
        run: python -m pytest -q tests/test_nfl_prop_under_role_change.py
      - name: Grade role-change split
        if: ${{ !cancelled() }}
        run: |
          python -m research.nfl_prop_under_role_change grade --write-db --out artifacts/nfl_prop_under_role_change_latest.json
      - name: Save the grade report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-prop-under-grade
          path: |
            artifacts/nfl_prop_under_grade_latest.json
            artifacts/nfl_prop_under_v2_grade_latest.json
            artifacts/nfl_prop_under_role_change_latest.json
          if-no-files-found: ignore
          retention-days: 90

  # Betting-scenario chart images (model/nfl_market_scenarios.py): moneyline,
  # spread and total by situation, season to date vs 2023-25. Descriptive, for
  # publishing; reads only the nflverse schedule file, so it has its own job.
  market-scenario-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Render the charts
        run: python -m model.nfl_market_scenarios --out-dir artifacts/nfl_market_scenarios
      # Reader charts beyond the betting scenarios: play-by-play stories,
      # schedule and market (line moves read our odds history), DFS and props.
      - name: Render the play-by-play charts
        if: ${{ !cancelled() }}
        run: python -m model.nfl_play_charts --out-dir artifacts/nfl_market_scenarios
      - name: Render the schedule and market charts
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m model.nfl_schedule_market_charts --out-dir artifacts/nfl_market_scenarios
      # The prop chart reads nfl_prop_implied_lines, which nothing else keeps current.
      # Idempotent: only new rows are written, prices are never rewritten.
      - name: Store the season's closing prop lines
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m research.nfl_prop_implied build --weeks 1-18
      - name: Render the DFS and prop charts
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m model.nfl_dfs_story_charts --out-dir artifacts/nfl_market_scenarios
          python -m model.nfl_dfs_more_charts --out-dir artifacts/nfl_market_scenarios
          python -m model.nfl_prop_player_charts --out-dir artifacts/nfl_market_scenarios
          python -m model.nfl_ownership_charts --out-dir artifacts/nfl_market_scenarios
          python -m model.nfl_prop_history_charts --out-dir artifacts/nfl_market_scenarios
          python -m model.nfl_defense_qb_charts --out-dir artifacts/nfl_market_scenarios
      - name: Save the charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-market-scenario-charts
          path: artifacts/nfl_market_scenarios/
          if-no-files-found: error
          retention-days: 90

  # The weekly market-anchored game-leaders grade (nfl-leaders-anchored-test-v1).
  grade-leaders-anchored:
    needs: review
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Verify the registered test
        run: python -m pytest -q tests/test_nfl_game_leaders_anchored.py
      - name: Grade
        run: |
          mkdir -p artifacts
          python -m research.nfl_game_leaders_anchored grade --write-db --out artifacts/nfl_leaders_anchored_grade_latest.json
      - name: Save the grade report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-leaders-anchored-grade
          path: artifacts/nfl_leaders_anchored_grade_latest.json
          if-no-files-found: ignore
          retention-days: 90

  # The weekly replacement-upside grade (nfl-replacement-upside-grade-v1).
  # Runs after the review even if one of its steps failed: the grade reads only
  # results that exist, and blocking it on an unrelated report-card failure is
  # the health-gate mistake recorded in CLAUDE.md.
  grade-replacement-upside:
    needs: review
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `npm install`, not `npm ci`: see run_nfl_cash_optimizer.yml.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Refuse to grade if the gate's own logic or frozen constants are broken.
      - name: Verify the registered gate
        run: npm run test:nfl-replacement-upside-grade
      - name: Grade
        run: |
          mkdir -p ../artifacts
          npm run grade:nfl-replacement-upside -- --out ../artifacts/nfl_replacement_upside_grade_latest.json
      - name: Save the grade report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-replacement-upside-grade
          path: artifacts/nfl_replacement_upside_grade_latest.json
          if-no-files-found: ignore
          retention-days: 90
