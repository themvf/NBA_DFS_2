name: Refresh NFL Vegas

on:
  schedule:
    # 9:20 AM ET during daylight saving time. Safe no-op outside the season.
    - cron: "20 13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target NFL game date YYYY-MM-DD (Eastern)"
        required: false
        type: string

concurrency:
  group: refresh-nfl-vegas
  cancel-in-progress: false

jobs:
  refresh-nfl-vegas:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Resolve Eastern date
        shell: bash
        run: |
          TARGET_DATE="${{ inputs.date }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE="$(TZ=America/New_York date +%F)"
          fi
          echo "NFL_TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
      - name: Refresh NFL schedule, odds, scores, and alerts
        run: python -m ingest.refresh_nfl_vegas --date "$NFL_TARGET_DATE"
