name: TSDB Probe (diagnostic)

# Temporary diagnostic: inspect TheSportsDB tennis (ATP/WTA) coverage + whether
# per-match serve stats exist. Manually triggered; delete after the decision.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: pip install requests
      - name: Run tennis probe
        run: python scripts/tennis_tsdb_probe.py
