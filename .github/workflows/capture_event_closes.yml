name: Capture Event Closing Lines

on:
  schedule:
    # The worker makes no paid request when no checkpoint is due. Five-minute
    # polling is required to distinguish T-15 from the T-5 close candidate.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: capture-event-closing-lines
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_CLOSE_DAILY_CREDIT_CAP: ${{ vars.ODDS_CLOSE_DAILY_CREDIT_CAP || '240' }}
      ODDS_CLOSE_MIN_REMAINING: ${{ vars.ODDS_CLOSE_MIN_REMAINING || '250' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Ensure append-only movement observation storage
        run: python -m model.signal_observations
      - name: Capture due checkpoints and freeze verified closes
        run: python -m ingest.event_closing_lines --existing-schema
      # Scan the stored Tennis captures immediately; this makes no paid odds
      # request and avoids waiting for the separate 15-minute settlement job.
      - name: Detect and grade Tennis market signals
        run: python -m model.line_alerts --sport tennis --existing-schema
      - name: Detect and grade prospective CFB market signals
        run: python -m model.line_alerts --sport cfb --existing-schema
      - name: Audit CFB capture and grading integrity
        run: python -m ingest.cfb_capture_audit
      - name: Detect and grade NFL market signals
        run: python -m model.line_alerts --sport nfl --existing-schema
