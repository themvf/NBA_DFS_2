name: Capture Event Closing Lines

on:
  workflow_dispatch:

concurrency:
  group: capture-event-closing-lines
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Capture due checkpoints and freeze verified closes
        run: python -m ingest.event_closing_lines
      - name: Detect and grade prospective CFB market signals
        run: python -m model.line_alerts --sport cfb
