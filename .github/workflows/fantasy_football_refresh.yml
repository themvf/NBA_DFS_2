name: Refresh Fantasy Football Draft Data

on:
  schedule:
    # Every six hours during the North American draft season. The ingestion
    # script is snapshot-idempotent, and browser traffic never calls the API.
    - cron: "17 1,7,13,19 * 7-9 *"
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season"
        required: false
        default: "2026"
        type: string
      mode:
        description: "Refresh scope"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - fantasypros-audit
          - fantasypros-snapshot

concurrency:
  group: fantasy-football-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build independent rankings from Sleeper and nflverse
        if: ${{ inputs.mode == '' || inputs.mode == 'full' }}
        run: python -m ingest.ff_independent --season "${{ inputs.season || '2026' }}"
      - name: Audit upgraded FantasyPros endpoint contracts
        id: fantasypros-audit
        continue-on-error: true
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: >-
          python -m ingest.ff_fantasypros
          --season "${{ inputs.season || '2026' }}"
          --audit-only
          --require-contracts
          --audit-output fantasypros-audit.json
      - name: Persist verified FantasyPros source snapshots
        if: ${{ steps.fantasypros-audit.outcome == 'success' && inputs.mode != 'fantasypros-audit' }}
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: >-
          python -m ingest.ff_fantasypros
          --season "${{ inputs.season || '2026' }}"
          --snapshot-contracts
      - name: Upload sanitized FantasyPros audit
        if: ${{ always() && hashFiles('fantasypros-audit.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fantasypros-endpoint-audit
          path: fantasypros-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Report FantasyPros soft-dependency state
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ "${{ steps.fantasypros-audit.outcome }}" == "success" ]]; then
            echo "### FantasyPros: full required endpoint contracts passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### FantasyPros: unavailable, invalid, or sample-sized" >> "$GITHUB_STEP_SUMMARY"
            echo "The independent Sleeper/nflverse board completed and remains authoritative." >> "$GITHUB_STEP_SUMMARY"
          fi
