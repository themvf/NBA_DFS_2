name: Refresh Soccer (World Cup)

# 3h cron: settle → re-train ratings on live WC results → odds + predictions → rate bets.
# Weekly cron (Mondays): also refreshes player xG history from StatsBomb open data.
# StatsBomb pulls from github.com/statsbomb/open-data — no auth, no IP restrictions.
# Ratings are now auto-updated every 3h from completed WC 2026 scores in the DB.

on:
  schedule:
    # Every 3 hours — keeps lines + predictions fresh through a match day.
    - cron: "0 */3 * * *"
    # Weekly on Monday 06:00 UTC — refresh player history from StatsBomb.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      date:
        description: "Kickoff date YYYY-MM-DD (UTC). Default: all upcoming fixtures"
        required: false
        type: string
      refresh_player_history:
        description: "Force-refresh player xG history from StatsBomb"
        required: false
        type: boolean
        default: false

concurrency:
  group: refresh-soccer
  cancel-in-progress: false

jobs:
  refresh-soccer:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY || '123' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh player xG history (weekly or on demand)
        if: github.event.schedule == '0 6 * * 1' || inputs.refresh_player_history == true
        run: python -m ingest.soccer_player_history

      - name: Backfill completed fixtures missing from the schedule (TheSportsDB)
        # The odds feed only carries upcoming games and /scores reaches back just
        # 3 days, so matches that kicked off before first ingest are never
        # captured. Recover them from TheSportsDB's full fixture history so
        # standings, settlement, ratings, and the group sim all see real results.
        run: python -m ingest.soccer_backfill_results

      - name: Backfill goal timelines from TheSportsDB (first scorers + goal minutes)
        # BEFORE settlement: settle_game_bets grades knockout moneyline/totals on
        # the 90-minute score, which derive_regulation_scores rebuilds from these
        # goal timelines (goals with minute <= 90). Running this first lets a
        # knockout tie settle in the same cycle it completes.
        run: python -m ingest.soccer_scorers_history

      - name: Settle completed bets (scores + regulation derivation + group standings)
        run: python -m ingest.soccer_results --days-from 3

      - name: Re-train strength ratings on live WC 2026 results
        run: python -m model.soccer_ratings

      - name: Refresh World Cup odds + model predictions
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m ingest.soccer_schedule --date "${{ inputs.date }}"
          else
            python -m ingest.soccer_schedule
          fi

      - name: Capture WC anytime-scorer prop odds (per-book, DK outlier detection)
        run: python -m ingest.soccer_prop_odds

      - name: Scan + settle sharp line alerts (soccer)
        run: python -m model.line_alerts --sport soccer

      - name: Populate knockout bracket slots (for the bracket tree + exact deep-run)
        # Idempotent; sets bracket_slot on the R32 ties so soccer_futures simulates
        # the real bracket path instead of a strength-seeded approximation.
        run: python -m ingest.soccer_bracket

      - name: Rate futures bets (outright + group winner)
        run: python -m model.soccer_futures --sims 20000

      - name: Rate moneyline + totals bets (every fixture)
        run: python -m model.soccer_game_bets

      - name: Rate first-scorer bets (near-term fixtures)
        run: python -m model.soccer_first_scorer --hours 48

      - name: Settlement health check (alerts on stuck/wrong first-scorer bets)
        # always() so a failed settle/rating step above can't hide a rotting
        # ledger. Emits ::warning:: annotations for any impossible-state void or
        # stale-pending game so it surfaces in the Actions run summary.
        if: always()
        run: python -m ingest.soccer_results --health-check
