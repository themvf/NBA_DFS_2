name: Refresh Soccer (World Cup)

# 3h cron: settle → re-train ratings on live WC results → odds + predictions → rate bets.
# Weekly cron (Mondays): also refreshes player xG history from StatsBomb open data.
# StatsBomb pulls from github.com/statsbomb/open-data — no auth, no IP restrictions.
# Ratings are now auto-updated every 3h from completed WC 2026 scores in the DB.

on:
  schedule:
    # Every 3 hours — keeps lines + predictions fresh through a match day.
    - cron: "0 */3 * * *"
    # Weekly on Monday 06:00 UTC — refresh player history from StatsBomb.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      date:
        description: "Kickoff date YYYY-MM-DD (UTC). Default: all upcoming fixtures"
        required: false
        type: string
      refresh_player_history:
        description: "Force-refresh player xG history from StatsBomb"
        required: false
        type: boolean
        default: false

concurrency:
  group: refresh-soccer
  cancel-in-progress: false

jobs:
  refresh-soccer:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh player xG history (weekly or on demand)
        if: github.event.schedule == '0 6 * * 1' || inputs.refresh_player_history == true
        run: python -m ingest.soccer_player_history

      - name: Settle completed bets (scores + group standings)
        run: python -m ingest.soccer_results --days-from 3

      - name: Re-train strength ratings on live WC 2026 results
        run: python -m model.soccer_ratings

      - name: Refresh World Cup odds + model predictions
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m ingest.soccer_schedule --date "${{ inputs.date }}"
          else
            python -m ingest.soccer_schedule
          fi

      - name: Rate futures bets (outright + group winner)
        run: python -m model.soccer_futures --sims 20000

      - name: Rate moneyline + totals bets (every fixture)
        run: python -m model.soccer_game_bets

      - name: Rate first-scorer bets (near-term fixtures)
        run: python -m model.soccer_first_scorer --hours 48
