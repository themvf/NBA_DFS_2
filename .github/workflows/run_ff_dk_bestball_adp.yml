name: Load DraftKings Best Ball ADP

on:
  workflow_dispatch:
    inputs:
      draft_group_id:
        description: "DK draft group ID (from the DK Best Ball lobby URL)"
        required: true
        type: string
      season:
        description: "NFL season"
        required: false
        default: "2026"
        type: string
      file_path:
        description: "Repo-relative path to the saved playerpool JSON response body"
        required: false
        default: "data/ff_dk_bestball_adp_capture.json"
        type: string

jobs:
  load:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest DK Best Ball ADP
        run: |
          python -m ingest.ff_dk_bestball_adp \
            --file "${{ inputs.file_path }}" \
            --draft-group "${{ inputs.draft_group_id }}" \
            --season "${{ inputs.season }}"
