name: NBA registered research operations

# Primary clock: existing Vercel dispatcher, Eastern time. No paid collection.
# The local 9 AM message consumes these results; healthy runs send no message.
on:
  schedule:
    - cron: '20 14 * 1-6,10-12 *'
    - cron: '52 16 * 1-6,10-12 *'
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [check, review]
        default: check
      date:
        description: Eastern slate date (review defaults to yesterday)
        required: false
        default: ''
permissions:
  contents: read
  issues: write
concurrency:
  group: nba-registered-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GAME_DATE: ${{ inputs.date }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # Packed research archives kept between runs, so a review downloads from Neon only the
      # archives it has not seen (a check restores none, so it skips the cache). A copy is used
      # only when its sha256 matches the stored manifest; with no cache it downloads everything.
      - name: Restore the research archive cache
        id: archive-cache
        if: ${{ inputs.action == 'review' || github.event.schedule == '20 14 * 1-6,10-12 *' }}
        uses: actions/cache/restore@v4
        with:
          path: artifacts/nba-research-archive-cache
          key: nba-research-archives-latest
          restore-keys: nba-research-archives-
      - name: Review originals or check pre-lock readiness
        run: |
          action="${{ inputs.action }}"
          if [ -z "$action" ]; then
            if [ '${{ github.event.schedule }}' = '20 14 * 1-6,10-12 *' ]; then action=review; else action=check; fi
          fi
          python -m research.nba_research_cloud "$action" ${GAME_DATE:+--date "$GAME_DATE"} --root artifacts/nba-research --archive-cache artifacts/nba-research-archive-cache
      - name: List the research archive cache
        id: archive-list
        if: ${{ !cancelled() && (inputs.action == 'review' || github.event.schedule == '20 14 * 1-6,10-12 *') }}
        run: |
          mkdir -p artifacts/nba-research-archive-cache
          echo "count=$(ls artifacts/nba-research-archive-cache | wc -l)" >> "$GITHUB_OUTPUT"
          echo "key=nba-research-archives-$(ls artifacts/nba-research-archive-cache | sort | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - name: Keep the research archive cache when it gained an archive
        if: ${{ !cancelled() && steps.archive-list.outputs.count != '' && steps.archive-list.outputs.count != '0' && steps.archive-cache.outputs.cache-matched-key != steps.archive-list.outputs.key }}
        uses: actions/cache/save@v4
        with:
          path: artifacts/nba-research-archive-cache
          key: ${{ steps.archive-list.outputs.key }}
      - name: Notify failures and recovery once per state
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NBA_RESEARCH_ACTION: ${{ inputs.action || (github.event.schedule == '20 14 * 1-6,10-12 *' && 'review' || 'check') }}
        run: python -m research.nba_research_alert --root artifacts/nba-research --action "$NBA_RESEARCH_ACTION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-research-operations-${{ github.run_id }}
          path: artifacts/nba-research/
          if-no-files-found: warn
          retention-days: 90
