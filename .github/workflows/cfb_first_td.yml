name: CFB First Touchdown Forecasts

# Saves our own first-touchdown-scorer forecasts (model/cfb_first_td.py) for
# every CFB game kicking off in the next 40 hours, for the /cfb/first-td page.
# Started games are never written, so each game keeps its last pregame
# forecast. Reads stored box scores and implied totals only: no CFBD or Odds
# API calls. /api/cron/dispatch fires it daily and about three hours before
# each kickoff group (job cfb-first-td); this schedule is the fallback.
on:
  schedule:
    - cron: "41 10 * 8-12 *"
    - cron: "41 10 * 1 *"
  workflow_dispatch:

concurrency:
  group: cfb-first-td
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish first touchdown forecasts
        run: python -m model.cfb_first_td publish
