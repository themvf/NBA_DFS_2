name: Capture NBA points props

# Feeds /nba/top-scorers and the contest builder. Dispatched by /api/cron/dispatch
# (job nba-points-props), October through June: the morning read at 15:07 UTC
# after the books post player props, then one read 35-50 minutes before the
# first tip of each tip group (the night's first tip, and each tip more than two
# hours after the previous group's first). Only games still to tip are
# fetched. The old fixed 22:07 and 01:07 UTC reads remain as a fallback when the
# tip times are unknown or no group starts near them. The page shows each game's latest capture; the
# nightly grade (grade_nba_points_props.yml) scores each game's last capture
# before its tip. Two credits per game on the shared ODDS_API_KEY (two
# markets, six books via bookmakers=), about 60 a day. The schedule below is a
# thin fallback for a broken dispatcher bridge; GitHub runs it hours late, and
# the script skips games that have already tipped.
on:
  schedule:
    - cron: "37 16 * 1-6,10-12 *"
  workflow_dispatch:
    inputs:
      date:
        description: Eastern date of the games, YYYY-MM-DD (blank = today ET)
        required: false
        default: ""
      max_credits:
        description: Hard Odds API credit ceiling for this run
        required: true
        default: "40"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture player-points lines
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GAME_DATE: ${{ inputs.date }}
          MAX_CREDITS: ${{ inputs.max_credits || '40' }}
        run: >-
          python -m ingest.nba_points_props
          ${GAME_DATE:+--date "$GAME_DATE"}
          --max-credits "$MAX_CREDITS"
          --apply
      # Winner-take-all contest entries (research/nba_wta_trios.py, docs/nba-wta-trios.md):
      # frozen from the lines just captured, only while every game on the date is still
      # to tip (a run after the first tip reports "after_first_tip" and writes nothing). No credits.
      - name: Freeze winner-take-all contest entries
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GAME_DATE: ${{ inputs.date }}
        run: >-
          python -m research.nba_wta_trios freeze
          ${GAME_DATE:+--date "$GAME_DATE"}
          --apply
