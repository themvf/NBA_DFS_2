name: Capture NBA points props

# Feeds /nba/top-scorers. Dispatched by /api/cron/dispatch (job
# nba-points-props) at 15:07 and 22:07 UTC, October through June: the morning
# read after the books post player props, and the closing read before the
# 7 PM ET tips. The page shows each game's latest capture. Two credits per game
# on the shared ODDS_API_KEY (two markets, six books via bookmakers=), about
# 50 a day. The schedule below is a thin fallback for a broken dispatcher
# bridge; GitHub runs it hours late, and the script skips games that have
# already tipped.
on:
  schedule:
    - cron: "37 16 * 1-6,10-12 *"
  workflow_dispatch:
    inputs:
      date:
        description: Eastern date of the games, YYYY-MM-DD (blank = today ET)
        required: false
        default: ""
      max_credits:
        description: Hard Odds API credit ceiling for this run
        required: true
        default: "40"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture player-points lines
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GAME_DATE: ${{ inputs.date }}
          MAX_CREDITS: ${{ inputs.max_credits || '40' }}
        run: >-
          python -m ingest.nba_points_props
          ${GAME_DATE:+--date "$GAME_DATE"}
          --max-credits "$MAX_CREDITS"
          --apply
