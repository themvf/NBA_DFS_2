name: Refresh NFL DFS Projections

on:
  schedule:
    # Cadence is owned by Vercel Cron, NOT by this schedule: GitHub skipped the
    # 21:35 UTC slot on 2026-09-26 and Sunday's slate was left on a 1:22 PM
    # projection. /api/cron/dispatch (job nfl-projections) dispatches this workflow at the
    # slots in web/src/lib/nfl-dfs/projection-cadence.ts (13:35 and 21:35
    # daily, plus 16:05 and 19:05 UTC on Sundays). The rebuild has to happen,
    # not just the injury feed: the zero-and-replace rule runs inside
    # build_week, and roster evidence newer than a projection's decision time is
    # refused. This single daily run is a thin fallback in case the bridge
    # breaks -- the same arrangement as refresh_nfl_dk_pool.yml.
    - cron: "50 14 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season year (January-March defaults to previous year)"
        required: false
        type: string
      week:
        description: "Optional explicit regular-season week"
        required: false
        type: string

concurrency:
  group: refresh-nfl-dfs-projections
  cancel-in-progress: false

jobs:
  refresh:
    name: Production projection snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NFL_RESEARCH_SEASON: ${{ inputs.season }}
      NFL_RESEARCH_WEEK: ${{ inputs.week }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh current-season inputs and immutable results
        id: results
        run: |
          python -c "import os,sys; sys.argv=['weekly','--phase','results']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season')] if os.environ.get(key)]; from ingest.nfl_dfs_weekly import main; main()"
      - name: Capture game-week injury evidence
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: |
          python -c "import os,sys; sys.argv=['availability']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from ingest.nfl_dfs_availability import main; main()"
      - name: Retain availability coverage audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nfl-availability-audit
          path: artifacts/nfl-availability-audit.json
          retention-days: 90
      # A FantasyPros-only roster row with a gsis twin is a duplicate identity;
      # build_week now refuses to run on one. Deactivate (never delete) first.
      - name: Deactivate duplicate roster identities
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['dedupe']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season')] if os.environ.get(key)]; from ingest.ff_dedupe_identities import main; main()"
      - name: Refresh published PFR matchup evidence
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python -c "import os,sys; from datetime import datetime,timezone; now=datetime.now(timezone.utc); season=int(os.environ.get('NFL_RESEARCH_SEASON') or (now.year-1 if now.month<=3 else now.year)); sys.argv=['pfr','--season',str(season),'--write-db']; from ingest.nfl_pfr_nflverse import main; sys.exit(main())"
      - name: Retain PFR publication coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nfl-pfr-publication-coverage
          path: |
            data/pfr/nflverse-output/run-report.json
            data/pfr/nflverse-output/identity-report.json
            data/pfr/nflverse-output/identity/
          retention-days: 90
      - name: Build immutable projection snapshot
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['weekly','--phase','projections']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from ingest.nfl_dfs_weekly import main; main()"

  research:
    name: Research forecasts and report cards
    needs: refresh
    if: ${{ !cancelled() && needs.refresh.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NFL_RESEARCH_SEASON: ${{ inputs.season }}
      NFL_RESEARCH_WEEK: ${{ inputs.week }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The repository's current lockfile is incomplete; follow the existing
      # NFL optimizer workflow rather than silently failing npm ci.
      - name: Install scenario and optimizer dependencies
        id: scenario_dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Record the earliest accepted comparison capture
        run: python -c "import os; from datetime import datetime,timezone; open(os.environ['GITHUB_ENV'],'a').write('NFL_MATCHUP_CAPTURE_NOT_BEFORE='+datetime.now(timezone.utc).isoformat()+'\n')"
      - name: Freeze research-only workload forecasts
        id: workload
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['workload']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from ingest.nfl_dfs_workload import main; main()"
      - name: Freeze research-only efficiency forecasts
        if: ${{ !cancelled() && steps.workload.outcome == 'success' }}
        run: |
          python -c "import os,sys; sys.argv=['efficiency']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from ingest.nfl_dfs_efficiency import main; main()"
      - name: Freeze and settle shadow-only research forecasts
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['shadow']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from ingest.nfl_dfs_shadow import main; main()"
      - name: Freeze registered matchup forecasts for the saved upcoming slate
        id: matchup
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['matchup','--persist']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from research.nfl_matchup_implementation import main; main()"
      - name: Freeze coherent research scenarios and publish the compact comparison
        if: ${{ !cancelled() && steps.matchup.outcome == 'success' && steps.scenario_dependencies.outcome == 'success' }}
        run: |
          python -c "import os,sys; sys.argv=['scenario-refresh','--persist','--not-before',os.environ['NFL_MATCHUP_CAPTURE_NOT_BEFORE']]; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from research.nfl_matchup_scenario_refresh import main; sys.exit(main())"
      - name: Freeze registered pickem matchup forecasts
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['matchup-study','freeze-pickem']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from research.nfl_matchup_study import main; sys.exit(main())"
      - name: Grade registered matchup forecasts on completed weeks
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['matchup-study','prospective','--capture-results','--output','artifacts/nfl-matchup-forward-report.json']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season')] if os.environ.get(key)]; from research.nfl_matchup_study import main; sys.exit(main())"
      - name: Audit stored model input coverage
        if: ${{ !cancelled() }}
        run: python -m ingest.nfl_dfs_feature_audit
      - name: Grade frozen context variants and verify freeze coverage
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['matchup-study','context']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season')] if os.environ.get(key)]; from research.nfl_matchup_study import main; sys.exit(main())"
      - name: Retain context grading and health evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nfl-context-variant-study
          path: artifacts/nfl_dfs_context_variant_study.json
          retention-days: 90
      - name: Retain matchup forecast and evaluation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nfl-matchup-forward-evidence
          path: |
            artifacts/nfl-matchup-implementation/
            artifacts/nfl-matchup-forward-report.json
          retention-days: 90
      - name: Save weekly production and shadow report cards
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['reportcard']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season')] if os.environ.get(key)]; from ingest.nfl_dfs_reportcard import main; main()"
      # Slate-scoped stream: the players DK actually listed, graded under DK's
      # own no-stat-line = 0 rule. Separate version/table from the roster
      # report above; it is the grader for the zero-history prior study (WP1).
      - name: Save slate-scoped report cards (DraftKings convention)
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['slate-reportcard']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season')] if os.environ.get(key)]; from ingest.nfl_dfs_slate_reportcard import main; main()"
      # Phone-readable weekly review. Read-only and fail-soft: a digest that
      # cannot render must not redden a run whose actual work succeeded.
      - name: Publish the weekly review to the run summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        # `shell: bash` sets pipefail, without which the pipe into tee would
        # swallow a non-zero exit and report a green step over an empty summary.
        # tee, not `>>`: the digest belongs in BOTH the run summary (readable on
        # a phone) and the job log (readable by anything without database access).
        shell: bash
        run: |
          python -c "import os,sys; sys.argv=['digest']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from ingest.nfl_dfs_review_digest import main; sys.exit(main())" | tee -a "$GITHUB_STEP_SUMMARY"
