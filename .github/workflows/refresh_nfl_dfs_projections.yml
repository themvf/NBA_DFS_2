name: Refresh NFL DFS Projections

on:
  schedule:
    # Twice daily. Times are UTC, so the Eastern clock shifts an hour at the
    # DST boundary; both slots stay comfortably pregame either way.
    #
    # 13:35 UTC = 09:35 ET — the morning pass, ahead of Sunday's early games.
    # 21:35 UTC = 17:35 ET (16:35 in winter) — added for Thursday night. A
    #   Thursday game kicks off at 20:15 ET, and its final game status is filed
    #   on Wednesday, so the morning pass alone gave Thursday exactly one
    #   chance to see it. This is the second. It also picks up Saturday evening
    #   news ahead of Sunday, and Sunday afternoon news ahead of the night game.
    #
    # The projection has to be rebuilt, not just the injury feed re-captured:
    # the zero-and-replace rule runs inside build_week, so a fresher status
    # only reaches a projection when the projection is rebuilt. A second pass
    # also moves the report card's "last accepted pregame forecast" closer to
    # kickoff for every game, not only Thursday's.
    - cron: "35 13 * * *"
    - cron: "35 21 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season year (January-March defaults to previous year)"
        required: false
        type: string
      week:
        description: "Optional explicit regular-season week"
        required: false
        type: string

concurrency:
  group: refresh-nfl-dfs-projections
  cancel-in-progress: false

jobs:
  refresh:
    name: Production projection snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NFL_RESEARCH_SEASON: ${{ inputs.season }}
      NFL_RESEARCH_WEEK: ${{ inputs.week }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh current-season inputs and immutable results
        id: results
        run: |
          python -c "import os,sys; sys.argv=['weekly','--phase','results']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season')] if os.environ.get(key)]; from ingest.nfl_dfs_weekly import main; main()"
      - name: Capture game-week injury evidence
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: |
          python -c "import os,sys; sys.argv=['availability']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from ingest.nfl_dfs_availability import main; main()"
      - name: Retain availability coverage audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nfl-availability-audit
          path: artifacts/nfl-availability-audit.json
          retention-days: 90
      - name: Build immutable projection snapshot
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['weekly','--phase','projections']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from ingest.nfl_dfs_weekly import main; main()"

  research:
    name: Research forecasts and report cards
    needs: refresh
    if: ${{ !cancelled() && needs.refresh.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NFL_RESEARCH_SEASON: ${{ inputs.season }}
      NFL_RESEARCH_WEEK: ${{ inputs.week }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Freeze research-only workload forecasts
        id: workload
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['workload']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from ingest.nfl_dfs_workload import main; main()"
      - name: Freeze research-only efficiency forecasts
        if: ${{ !cancelled() && steps.workload.outcome == 'success' }}
        run: |
          python -c "import os,sys; sys.argv=['efficiency']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from ingest.nfl_dfs_efficiency import main; main()"
      - name: Freeze and settle shadow-only research forecasts
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['shadow']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from ingest.nfl_dfs_shadow import main; main()"
      - name: Audit stored model input coverage
        if: ${{ !cancelled() }}
        run: python -m ingest.nfl_dfs_feature_audit
      - name: Save weekly production and shadow report cards
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['reportcard']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season')] if os.environ.get(key)]; from ingest.nfl_dfs_reportcard import main; main()"
      # Phone-readable weekly review. Read-only and fail-soft: a digest that
      # cannot render must not redden a run whose actual work succeeded.
      - name: Publish the weekly review to the run summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        # `shell: bash` sets pipefail, without which the pipe into tee would
        # swallow a non-zero exit and report a green step over an empty summary.
        # tee, not `>>`: the digest belongs in BOTH the run summary (readable on
        # a phone) and the job log (readable by anything without database access).
        shell: bash
        run: |
          python -c "import os,sys; sys.argv=['digest']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from ingest.nfl_dfs_review_digest import main; sys.exit(main())" | tee -a "$GITHUB_STEP_SUMMARY"
