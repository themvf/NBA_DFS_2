name: Refresh NFL DFS Projections

# PRODUCTION ONLY: everything the DFS page needs to build a lineup, and nothing
# else. A red run here means production broke. Research (shadow and scenario
# studies, matchup grading, input audits, report cards) runs afterwards in
# refresh_nfl_dfs_research.yml, triggered by this workflow's completion, and
# keeps its own status. Until 2026-09-28 both lived here, and 6 of 8 runs went
# red on research steps while the projection snapshot saved fine, so a real
# production failure would have looked like every other day.
#
# Kept fast on purpose: an "Update data" button will dispatch this workflow.

on:
  schedule:
    # Cadence is owned by Vercel Cron, NOT by this schedule: GitHub skipped the
    # 21:35 UTC slot on 2026-09-26 and Sunday's slate was left on a 1:22 PM
    # projection. /api/cron/dispatch (job nfl-projections) dispatches this workflow at the
    # slots in web/src/lib/nfl-dfs/projection-cadence.ts (13:35 and 21:35
    # daily, plus 16:05 and 19:05 UTC on Sundays). The rebuild has to happen,
    # not just the injury feed: the zero-and-replace rule runs inside
    # build_week, and roster evidence newer than a projection's decision time is
    # refused. This single daily run is a thin fallback in case the bridge
    # breaks -- the same arrangement as refresh_nfl_dk_pool.yml.
    - cron: "50 14 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season year (January-March defaults to previous year)"
        required: false
        type: string
      week:
        description: "Optional explicit regular-season week"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: refresh-nfl-dfs-projections
  cancel-in-progress: false

jobs:
  refresh:
    name: Production projection snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NFL_RESEARCH_SEASON: ${{ inputs.season }}
      NFL_RESEARCH_WEEK: ${{ inputs.week }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh current-season inputs and immutable results
        id: results
        run: |
          python -c "import os,sys; sys.argv=['weekly','--phase','results']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season')] if os.environ.get(key)]; from ingest.nfl_dfs_weekly import main; sys.exit(main())"
      # Every nflverse player-week row the results phase could not attach to a
      # player (name, week, points). More than 5% unmatched fails the step.
      - name: Retain weekly identity coverage
        if: ${{ !cancelled() && hashFiles('artifacts/nfl-weekly-identity/*.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nfl-weekly-identity
          path: artifacts/nfl-weekly-identity/
          retention-days: 30
      # Optional input: a failure leaves the build on the last stored capture.
      # It stays green, but the final step reports it as degraded.
      - name: Capture game-week injury evidence
        id: injury
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: |
          python -c "import os,sys; sys.argv=['availability']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from ingest.nfl_dfs_availability import main; sys.exit(main())"
      - name: Retain availability coverage audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nfl-availability-audit
          path: artifacts/nfl-availability-audit.json
          retention-days: 90
      # A FantasyPros-only roster row with a gsis twin is a duplicate identity;
      # build_week now refuses to run on one. Deactivate (never delete) first.
      - name: Deactivate duplicate roster identities
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['dedupe']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season')] if os.environ.get(key)]; from ingest.ff_dedupe_identities import main; sys.exit(main())"
      # Optional input, like the injury capture: the build and the matchup
      # forecasts fall back to the last published PFR evidence. Exit 0 also
      # covers games PFR has not charted yet because they finished less than
      # 72h ago (normal); exit 2 = degraded (an overdue chart or a failed
      # identity refresh); exit 1 = download/parse failure. run-status.json
      # says which, and the report step below reads it.
      - name: Refresh published PFR matchup evidence
        id: pfr
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python -c "import os,sys; from datetime import datetime,timezone; now=datetime.now(timezone.utc); season=int(os.environ.get('NFL_RESEARCH_SEASON') or (now.year-1 if now.month<=3 else now.year)); sys.argv=['pfr','--season',str(season),'--write-db']; from ingest.nfl_pfr_nflverse import main; sys.exit(main())"
      - name: Retain PFR publication coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nfl-pfr-publication-coverage
          path: |
            data/pfr/nflverse-output/run-report.json
            data/pfr/nflverse-output/run-status.json
            data/pfr/nflverse-output/identity-report.json
            data/pfr/nflverse-output/identity/
          retention-days: 90
      - name: Build immutable projection snapshot
        id: projections
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['weekly','--phase','projections']; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from ingest.nfl_dfs_weekly import main; sys.exit(main())"
      # The comparison window and output directory are fixed here, once, so the
      # research workflow grades exactly the comparison this run persisted --
      # even when it starts after midnight UTC.
      - name: Record the earliest accepted comparison capture
        if: ${{ !cancelled() }}
        run: python -c "import os; from datetime import datetime,timezone; now=datetime.now(timezone.utc); open(os.environ['GITHUB_ENV'],'a').write('NFL_MATCHUP_CAPTURE_NOT_BEFORE='+now.isoformat()+'\nNFL_MATCHUP_OUTPUT_DIR=artifacts/nfl-matchup-implementation/'+now.date().isoformat()+'\n')"
      # Production: nfl_matchup_forecast_runs is what the DFS page reads for
      # its defensive (opponent) adjustments (web/src/db/nfl-defensive-projections.ts).
      - name: Freeze registered matchup forecasts for the saved upcoming slate
        id: matchup
        if: ${{ !cancelled() }}
        run: |
          python -c "import os,sys; sys.argv=['matchup','--persist','--output-dir',os.environ['NFL_MATCHUP_OUTPUT_DIR']]; [(sys.argv.extend([flag,str(int(os.environ[key]))])) for key,flag in [('NFL_RESEARCH_SEASON','--season'),('NFL_RESEARCH_WEEK','--week')] if os.environ.get(key)]; from research.nfl_matchup_implementation import main; sys.exit(main())"
      - name: Write the research handoff
        if: ${{ !cancelled() }}
        env:
          MATCHUP_OUTCOME: ${{ steps.matchup.outcome }}
        run: |
          python -c "import json,os; os.makedirs('artifacts',exist_ok=True); keys=('GITHUB_RUN_ID','NFL_RESEARCH_SEASON','NFL_RESEARCH_WEEK','NFL_MATCHUP_CAPTURE_NOT_BEFORE','NFL_MATCHUP_OUTPUT_DIR','MATCHUP_OUTCOME'); json.dump({key.lower(): os.environ.get(key,'') for key in keys}, open('artifacts/nfl-dfs-research-handoff.json','w'), indent=2)"
      - name: Retain the research handoff
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nfl-dfs-research-handoff
          path: |
            artifacts/nfl-dfs-research-handoff.json
            artifacts/nfl-matchup-implementation/
          retention-days: 7
      # Degraded is not broken, so this never fails the run; it makes the
      # difference visible instead of leaving it behind continue-on-error.
      # "All optional inputs refreshed" is printed only when it is literally
      # true: both steps succeeded and PFR has nothing left to chart.
      - name: Report degraded optional inputs
        if: ${{ !cancelled() }}
        env:
          INJURY_OUTCOME: ${{ steps.injury.outcome }}
          PFR_OUTCOME: ${{ steps.pfr.outcome }}
          PFR_STATUS_FILE: data/pfr/nflverse-output/run-status.json
        run: |
          degraded=0
          report() {
            echo "::warning title=Degraded production input::$1"
            echo "- $1" >> "$GITHUB_STEP_SUMMARY"
            degraded=1
          }
          pfr_field() {
            python -c "import json,sys; d=json.load(open(sys.argv[1])); v=d.get(sys.argv[2]); print('; '.join(v) if isinstance(v,list) else (v or ''))" "$PFR_STATUS_FILE" "$1" 2>/dev/null || true
          }
          echo "## Optional production inputs" >> "$GITHUB_STEP_SUMMARY"
          if [ "$INJURY_OUTCOME" != success ]; then report "FantasyPros injury evidence did not refresh ($INJURY_OUTCOME); the build used the last stored capture."; fi
          pfr_status=$(pfr_field status)
          if [ "$PFR_OUTCOME" != success ]; then
            if [ -n "$pfr_status" ]; then
              report "PFR matchup evidence is degraded: $(pfr_field reasons). The build and matchup forecasts used the last published evidence for those games."
            else
              report "PFR matchup evidence did not refresh ($PFR_OUTCOME): the download or parse failed before any game was checked. The build and matchup forecasts used the last published evidence."
            fi
          fi
          awaiting=""
          if [ "$PFR_OUTCOME" = success ] && [ "$pfr_status" = awaiting_publication ]; then
            awaiting=$(pfr_field awaiting_publication)
            echo "- PFR has not charted these games yet; they finished less than 72h ago, which is normal (not degraded): $awaiting" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$degraded" = 0 ] && [ -z "$awaiting" ]; then echo "- All optional inputs refreshed." >> "$GITHUB_STEP_SUMMARY"; fi
