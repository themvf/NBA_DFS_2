name: TEMP CFB research query (branch only, read-only)
on:
  push:
    branches: [claude/cfb-pattern-backtest]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m research.cfb_model_ats --season 2026
