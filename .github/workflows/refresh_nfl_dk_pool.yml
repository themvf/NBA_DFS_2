name: Refresh NFL DraftKings Pool Status

# What DraftKings says about availability RIGHT NOW, appended as an
# observation. The salary file a slate was uploaded from is a photograph; this
# is the feed that makes it possible to build lineups on Wednesday and finalise
# them Thursday evening without drafting a player who was ruled out in between.
#
# Cost: zero. Both endpoints are public and unauthenticated, and no paid data
# API is touched. A poll that finds nothing changed writes no snapshot, only a
# heartbeat row, so running often is cheap in storage as well as in money.
#
# Cadence: owned by Vercel Cron, NOT by the schedule below. GitHub skipped all
# four of this workflow's first Thursday slots (16:00-17:30 UTC, 2026-09-24),
# so /api/cron/nfl-dk-pool now dispatches it on a game-proximity cadence
# (web/src/lib/nfl-dfs/dk-pool-cadence.ts): every 30 minutes through the
# Thursday, Sunday and Monday game windows, sparse otherwise. The schedule
# below is a thin fallback in case the bridge itself breaks -- the same
# arrangement as capture_odds_history.yml.
#
# The workspace shows when we last looked, so a slow or broken poll is visible
# rather than silently assumed fresh.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Poll draft groups starting within this many hours."
        required: false
        default: "120"
  schedule:
    - cron: "22 3,15 * * *"   # fallback only; see the note above

concurrency:
  group: nfl-dk-pool
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HOURS: ${{ inputs.hours }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Capture DraftKings pool status
        run: python -m ingest.nfl_dfs_dk_pool --hours "${HOURS:-120}"
      - name: Report
        if: always()
        run: python -m ingest.nfl_dfs_dk_pool --report
