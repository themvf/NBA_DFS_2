name: Capture Odds History

on:
  # Primary trigger is Vercel Cron (web/src/app/api/cron/mlb-odds-capture),
  # which fires this via `workflow_dispatch` every ~15 min from 10 AM ET
  # through 11:59 PM ET. GitHub's native `schedule:` trigger below is a
  # fallback only — verified 2026-08-04 that GitHub silently delays/drops
  # most firings of a 15-min schedule (observed real gaps of 60-95 min
  # during active hours, 3-13h overnight), which was starving the MLB
  # "Today's movement board" of fresh captures. Vercel Cron on Pro fires
  # within the configured minute, so it now owns the real cadence.
  workflow_dispatch:
  schedule:
    # Hourly safety net only (same 10 AM–11:59 PM ET active window), in case
    # the Vercel -> GitHub dispatch bridge breaks (expired token, Vercel
    # outage, etc.). Not the primary cadence anymore - see note above.
    - cron: "12 14-23,0-3 * * *"

concurrency:
  group: capture-odds-history
  cancel-in-progress: false

jobs:
  capture-odds:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve target date
        run: |
          TARGET_DATE="$(TZ=America/New_York date +%F)"
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"

      # MLB first: it's the in-season capture that feeds the CLV harness.
      - name: Capture MLB odds history
        shell: bash
        run: |
          for attempt in 1 2 3; do
            python -m ingest.mlb_schedule \
              --date "$TARGET_DATE" \
              --require-fresh-upcoming-odds && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            delay=$((attempt * 15))
            echo "MLB capture failed (attempt $attempt/3); retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Scan + settle sharp line alerts (MLB)
        # Auditable alert ledger: Pinnacle divergence + multi-book steam,
        # graded on CLV + outcomes (model/line_alerts.py). Telegram push if
        # the optional secrets are set.
        run: python -m model.line_alerts --sport mlb

      - name: Capture Polymarket tennis match prices
        # Free, no API key — polls Polymarket's Gamma API for short-lived
        # match-winner markets. Writes to game_odds_history so the existing
        # pinnacle_polymarket_delta detector picks them up automatically.
        continue-on-error: true
        run: python -m ingest.polymarket_tennis --matches-only
