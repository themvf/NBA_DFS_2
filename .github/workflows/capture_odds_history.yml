name: Capture Odds History

on:
  schedule:
    # Every 30 minutes from noon ET through 11:30 PM ET.
    - cron: "0,30 16-23,0-3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Game date YYYY-MM-DD (default: current America/New_York date)"
        required: false
        type: string

jobs:
  capture-odds:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve target date
        run: |
          TARGET_DATE="${{ inputs.date }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE="$(TZ=America/New_York date +%F)"
          fi
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"

      # MLB first: it's the in-season capture that feeds the CLV harness.
      - name: Capture MLB odds history
        run: python -m ingest.mlb_schedule --date "$TARGET_DATE"

      - name: Scan + settle sharp line alerts (MLB)
        # Auditable alert ledger: Pinnacle divergence + multi-book steam,
        # graded on CLV + outcomes (model/line_alerts.py). Telegram push if
        # the optional secrets are set.
        run: python -m model.line_alerts --sport mlb

      # stats.nba.com blocks GitHub runner IPs (ReadTimeout — the reason
      # daily_stats.yml was removed), so this step fails routinely. It must
      # never take the MLB capture down with it: continue-on-error, and it
      # runs AFTER MLB. During the offseason it does nothing useful anyway.
      - name: Capture NBA odds and props history
        continue-on-error: true
        run: python -m ingest.nba_schedule --date "$TARGET_DATE"
