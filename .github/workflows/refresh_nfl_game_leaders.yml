name: Publish NFL Game Leaders week

# Dispatched by /api/cron/dispatch (job nfl-game-leaders): Wednesday 14:07 UTC
# for the weekly build, then twice before each kickoff group: 150-165 minutes
# out with fresh availability, and 45-60 minutes out, after the inactive lists
# (ingest/nfl_espn_inactives.py). The schedule below is a thin fallback for a
# broken bridge.
# research.nfl_game_leaders_auto reuses the week's capture, keeps started games
# frozen, gates each game and lists anything it could not refresh.
on:
  schedule:
    - cron: "41 15 * * 3"
    - cron: "41 14 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-nfl-game-leaders
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture availability and publish the upcoming week
        run: python -m research.nfl_game_leaders_auto
      # The page matches DraftKings lines to a forecast by its decision time, so a
      # game re-run after its T-75 prop capture must be re-priced here or the page
      # loses its DK columns. Only games inside 75 minutes: earlier passes run
      # before the lines exist and the T-75 capture prices those.
      - name: Re-price re-run games against DraftKings lines
        id: reprice
        continue-on-error: true
        run: python -m research.nfl_game_leaders_market refresh --within-hours 1.25 --write-db
      # nfl-leaders-regime-roles-v1 (docs/nfl-leaders-regime-roles-study.md): roles-v3
      # shares and forecasts beside each published game's request, shadow only.
      # A failure here is annotated on the run and never blocks the publication.
      - name: Shadow roles-v3 beside the published requests (research only)
        id: regime_shadow
        continue-on-error: true
        run: python -m research.nfl_game_leaders_regime_roles shadow
      # Grade the shadowed games on the Wednesday build only: it takes the new
      # capture that holds last week's completed games. Blinded until the floors;
      # the verdict file is written once and committed below.
      - name: Grade roles-v3 against v2 (research only, Wednesdays)
        id: regime_grade
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "3" ]; then
            python -m research.nfl_game_leaders_regime_roles grade
          else
            echo "Not Wednesday (UTC); grade skipped."
          fi
      - name: Report the research steps
        if: ${{ !cancelled() }}
        env:
          SHADOW_OUTCOME: ${{ steps.regime_shadow.outcome }}
          GRADE_OUTCOME: ${{ steps.regime_grade.outcome }}
          REPRICE_OUTCOME: ${{ steps.reprice.outcome }}
        run: |
          {
            echo "### DraftKings re-pricing"
            echo "- reprice: ${REPRICE_OUTCOME:-not run}"
            echo "### Regime-roles research (nfl-leaders-regime-roles-v1)"
            echo "- shadow: ${SHADOW_OUTCOME:-not run}"
            echo "- grade: ${GRADE_OUTCOME:-not run}"
          } >> "$GITHUB_STEP_SUMMARY"
          for pair in "reprice:$REPRICE_OUTCOME" "shadow:$SHADOW_OUTCOME" "grade:$GRADE_OUTCOME"; do
            if [ "${pair#*:}" = "failure" ]; then
              echo "::warning::${pair%%:*} step failed; the publication is unaffected"
            fi
          done
      - name: Commit only a changed, validated publication
        run: |
          git add -f web/src/data/game-leaders.json web/src/data/game-leaders-weeks
          # Every capture/requests file a game's sources name: the DK pricing
          # refresh re-creates each forecast from these, so all must be in the repo.
          python -c "import json; d=json.load(open('web/src/data/game-leaders.json')); print('\n'.join(sorted({p for g in d['games'] for p in g['sources'].values()})))" > /tmp/sources.txt
          cat /tmp/sources.txt
          xargs -a /tmp/sources.txt git add -f
          git add -f artifacts/nfl-game-leaders/regime-roles-v1/shadow 2>/dev/null || true
          git add -f artifacts/nfl-game-leaders/regime-roles-v1/grade-runs artifacts/nfl-game-leaders/regime-roles-v1/verdict.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No publication change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update NFL Game Leaders forecasts"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "::error::Push to main failed after three attempts"
          exit 1
