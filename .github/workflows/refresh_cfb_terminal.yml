name: Refresh CFB Line Terminal

on:
  # Cadence is owned by the Vercel dispatcher (web/src/lib/cron-dispatch.ts,
  # job `cfb-terminal`), which fires every :07/:22/:37/:52 tick and names the
  # slot: `schedule` every six hours, `scores` on the other :07 ticks, `events`
  # otherwise. GitHub started the old 15-minute schedule only every 1-3 hours.
  # This 6-hourly line is the fallback for a broken bridge: a full refresh.
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      year:
        description: "CFB season year"
        required: false
        type: string
      force_schedule:
        description: "Refresh the full CFBD schedule on this run"
        required: false
        default: true
        type: boolean
      capture_now:
        description: "Make one paid odds capture outside checkpoint windows"
        required: false
        default: false
        type: boolean
      slot:
        description: "Dispatcher slot (schedule | scores | events); empty for a manual run"
        required: false
        default: ""
        type: string

concurrency:
  group: refresh-cfb-terminal
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Runs every 15 minutes: a hung CFBD or Odds API call would otherwise
    # queue the next runs behind it for GitHub's 6-hour default.
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Resolve season and schedule-refresh slot
        shell: bash
        env:
          INPUT_YEAR: ${{ inputs.year }}
          FORCE_SCHEDULE: ${{ inputs.force_schedule }}
          SCHEDULE: ${{ github.event.schedule }}
          SLOT: ${{ inputs.slot }}
        run: |
          year="${INPUT_YEAR:-$(TZ=America/New_York date +%Y)}"
          echo "CFB_YEAR=$year" >> "$GITHUB_ENV"
          case "${SLOT:-}" in
            ""|schedule|scores|events) ;;
            *) echo "::error title=Unknown slot::slot must be schedule, scores or events, got '$SLOT'"; exit 1 ;;
          esac
          refresh=false
          scores=false
          if [ "$SLOT" = "schedule" ] || [ "$SCHEDULE" = "7 */6 * * *" ]; then
            refresh=true
          elif [ "$SLOT" = "scores" ]; then
            scores=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -z "$SLOT" ]; then
            # Manual run: as before, a full schedule refresh unless unticked,
            # in which case recent scores only.
            if [ "${FORCE_SCHEDULE:-true}" = "true" ]; then refresh=true; else scores=true; fi
          fi
          echo "CFB_REFRESH_SCHEDULE=$refresh" >> "$GITHUB_ENV"
          echo "CFB_REFRESH_SCORES=$scores" >> "$GITHUB_ENV"
          echo "Slot '${SLOT:-${SCHEDULE:-manual}}': schedule=$refresh scores=$scores"
      - name: Refresh canonical CFBD schedule and scores
        if: env.CFB_REFRESH_SCHEDULE == 'true'
        run: python -m ingest.cfb_schedule --year "$CFB_YEAR" --refresh-schedule
      - name: Refresh recent scores hourly (dispatcher `scores` slot)
        if: env.CFB_REFRESH_SCORES == 'true'
        run: python -m ingest.cfb_schedule --refresh-scores
      - name: Synchronize exact official school and mascot aliases
        if: env.CFB_REFRESH_SCHEDULE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.slot == '')
        run: python -m ingest.cfb_schedule --refresh-team-aliases
      - name: Refresh free provider-event mappings
        run: python -m ingest.cfb_schedule --refresh-events
      # Paid checkpoint captures and frozen closes are owned by the shared
      # event-closing-lines workflow. Keeping them out of this 15-minute job
      # prevents overlapping schedulers from buying the same market snapshot.
      - name: Optional manual market capture
        if: github.event_name == 'workflow_dispatch' && inputs.capture_now == true
        run: python -m ingest.cfb_schedule --capture-now
      - name: Report CFB data health
        run: python -m ingest.cfb_schedule --health
      # Manual paid captures create history rows that the detector funnel reads
      # by normalized capture ID. The closing-lines worker already does this;
      # keep the independent terminal path in the same order.
      - name: Normalize stored CFB captures
        run: python -m ingest.cfb_context_bootstrap --origin-mode auto --apply
      - name: Detect and settle CFB market signals
        run: python -m model.line_alerts --sport cfb
