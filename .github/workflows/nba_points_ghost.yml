name: NBA ghost projections v2

# No Odds API calls. Read existing lines, verify free ESPN game classifications,
# and store new research snapshots/grade attempts without changing live forecasts.
# Real cadence: /api/cron/dispatch (jobs nba-ghost-freeze 15:37 UTC and
# nba-ghost-grade 11:37 UTC, October-June), since GitHub starts this repo's
# schedules hours late and a freeze after the first tip is refused. These two
# crons are a thin fallback: a late freeze fills only a missed morning (it never
# replaces a stored snapshot), and a repeated grade appends an attempt.
on:
  schedule:
    - cron: '50 16 * 1-6,10-12 *'
    - cron: '37 12 * 1-6,10-12 *'
  workflow_dispatch:
    inputs:
      action:
        description: Research action
        type: choice
        options: [freeze, grade]
        default: freeze
      date:
        description: Eastern slate date (blank = today for freeze, yesterday for grade)
        required: false
        default: ''

concurrency:
  group: nba-ghost-v2
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GAME_DATE: ${{ inputs.date }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture NBA rosters (decision-time team identity)
        if: github.event.schedule != '37 12 * 1-6,10-12 *' && inputs.action != 'grade'
        id: rosters
        continue-on-error: true
        run: python -m ingest.nba_rosters
      - name: Record a pre-first-tip ghost snapshot
        if: github.event.schedule != '37 12 * 1-6,10-12 *' && inputs.action != 'grade'
        run: >-
          python -m research.nba_ghost_runner freeze
          ${GAME_DATE:+--date "$GAME_DATE"}
          --output artifacts/nba-ghost/ghost.json --apply
      - name: Review workload conflicts in the frozen snapshot
        if: github.event.schedule != '37 12 * 1-6,10-12 *' && inputs.action != 'grade'
        run: >-
          python -m research.nba_points_workload_conflicts
          ${GAME_DATE:+--date "$GAME_DATE"} --apply
      - name: Grade frozen research predictions
        if: github.event.schedule == '37 12 * 1-6,10-12 *' || inputs.action == 'grade'
        run: >-
          python -m research.nba_ghost_runner grade
          ${GAME_DATE:+--date "$GAME_DATE"}
          --days-back 3 --apply
      - name: Grade workload-conflict flags
        if: github.event.schedule == '37 12 * 1-6,10-12 *' || inputs.action == 'grade'
        run: >-
          python -m research.nba_points_workload_conflicts --grade
          ${GAME_DATE:+--date "$GAME_DATE"} --apply
      - name: Report optional step outcomes
        if: ${{ always() && steps.rosters.outcome != '' }}
        env:
          ROSTERS_OUTCOME: ${{ steps.rosters.outcome }}
        run: |
          echo "## Optional steps" >> "$GITHUB_STEP_SUMMARY"
          echo "- NBA roster capture: $ROSTERS_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ROSTERS_OUTCOME" = failure ]; then echo "::warning title=Optional step failed::NBA roster capture ended failure (decision-time team stays unverified)"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-ghost-v2-${{ github.run_id }}
          path: artifacts/nba-ghost/
          if-no-files-found: ignore
          retention-days: 90
