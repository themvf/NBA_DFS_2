name: Capture NFL prop evidence

on:
  workflow_dispatch:
    inputs:
      event_limit:
        description: Maximum upcoming events to capture
        required: true
        default: "5"
      max_credits:
        description: Hard Odds API credit ceiling for this run
        required: true
        default: "0"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture raw and normalized prop evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: >-
          python -m ingest.nfl_prop_odds
          --event-limit "${{ inputs.event_limit }}"
          --max-credits "${{ inputs.max_credits }}"
          --apply
