name: Capture NFL prop evidence

# Dispatched by /api/cron/dispatch four times per Sunday/Monday game and twice
# per Thursday game: Wednesday and Friday 22:07 UTC (jobs nfl-prop-capture-wed /
# nfl-prop-capture-fri, main lines only, games 30 hours or more out: the field-lag
# study's early-week reads, docs/nfl-prop-field-lag-study.md), the day before
# (job nfl-prop-capture-day-ahead, 22:07 UTC, tomorrow's Eastern-date games) and
# 60-75 minutes before kickoff (job nfl-prop-capture, only the group kicking off
# then, after the inactives). The Sunday schedule below is a thin fallback in case
# the dispatcher bridge breaks; GitHub runs it hours late, and select_events still
# skips started games.
on:
  schedule:
    - cron: "37 14 * * 0"
  workflow_dispatch:
    inputs:
      event_limit:
        description: Maximum upcoming events to capture (0 = all inside the window)
        required: true
        default: "0"
      max_credits:
        description: Hard Odds API credit ceiling for this run
        required: true
        default: "420"
      within_hours:
        description: Only games starting within this many hours (0 = no window; never use with event_limit 0)
        required: true
        default: "2"
      min_hours:
        description: Skip games starting sooner than this many hours (a T-75 run leaves earlier groups alone)
        required: false
        default: "0"
      day_ahead:
        description: Only games on tomorrow's Eastern date
        required: false
        default: "false"
      markets:
        description: "all = main lines, volume, ladders and first TD (22 credits a game); main = main lines and volume only (12), the midweek reads"
        required: false
        default: "all"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture raw and normalized prop evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: >-
          python -m ingest.nfl_prop_odds
          --event-limit "${{ inputs.event_limit || '0' }}"
          --max-credits "${{ inputs.max_credits || '420' }}"
          --within-hours "${{ inputs.within_hours || '6' }}"
          --min-hours "${{ inputs.min_hours || '0' }}"
          --markets "${{ inputs.markets || 'all' }}"
          ${{ inputs.day_ahead == 'true' && '--day-ahead' || '' }}
          --apply
      # Re-price the saved game-leader forecasts against the lines just captured;
      # the game-leaders page reads the result (nfl_game_leader_market). A midweek
      # main-lines capture is a study input, not a pricing read, so it is skipped:
      # the next full capture (day-ahead or T-75) prices the leaders.
      - name: Price game leaders against DraftKings lines
        if: ${{ inputs.markets != 'main' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          python -m research.nfl_game_leaders_market refresh
          --within-hours "${{ inputs.within_hours || '6' }}"
          --write-db
      # nfl-leaders-anchored-test-v1: the same saved forecasts reshaped to DraftKings'
      # main lines and ladders (docs/nfl-leaders-anchored-test.md). Runs even if the
      # DK pricing step failed: it reads only the forecast and the captured lines.
      - name: Price market-anchored game leaders
        if: ${{ !cancelled() && inputs.markets != 'main' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          python -m research.nfl_game_leaders_anchored refresh
          --within-hours "${{ inputs.within_hours || '6' }}"
          --write-db
