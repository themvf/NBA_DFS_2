name: Capture NFL prop evidence

# Dispatched by /api/cron/dispatch (job nfl-prop-capture) about 1h45m before each
# kickoff group, capturing the games that start within the next two hours. The
# Sunday schedule below is a thin fallback in case the dispatcher bridge breaks;
# GitHub runs it hours late, and select_events still skips started games.
on:
  schedule:
    - cron: "37 14 * * 0"
  workflow_dispatch:
    inputs:
      event_limit:
        description: Maximum upcoming events to capture (0 = all inside the window)
        required: true
        default: "0"
      max_credits:
        description: Hard Odds API credit ceiling for this run
        required: true
        default: "420"
      within_hours:
        description: Only games starting within this many hours (0 = no window; never use with event_limit 0)
        required: true
        default: "2"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture raw and normalized prop evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: >-
          python -m ingest.nfl_prop_odds
          --event-limit "${{ inputs.event_limit || '0' }}"
          --max-credits "${{ inputs.max_credits || '420' }}"
          --within-hours "${{ inputs.within_hours || '6' }}"
          --apply
      # Re-price the saved game-leader forecasts against the lines just captured;
      # the game-leaders page reads the result (nfl_game_leader_market).
      - name: Price game leaders against DraftKings lines
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          python -m research.nfl_game_leaders_market refresh
          --within-hours "${{ inputs.within_hours || '6' }}"
          --write-db
