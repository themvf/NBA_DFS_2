name: Refresh Tennis (Wimbledon)

# Every 6h: refresh odds → write predictions → rate moneyline bets. Cadence is
# ACCOUNTABILITY-ONLY — P3 proved the market is sharp / no edge, so we sample the
# closing line to keep the ledger + backtest honest, not to chase a bet; 6h (vs
# the old 3h) halves Odds-API credit burn while staying <6h from any kickoff.
# Settlement (tennis-data.co.uk results) runs every cycle; continue-on-error
# so a flaky download never blocks the odds + recommendations refresh.
# Weekly (Mon 06:00 UTC): rebuild grass-Elo ratings for BOTH tours — ATP from
# TML-Database (with serve stats), WTA from tennis-data.co.uk (results only) —
# folding completed results back into player strength (see memory
# tennis-data-sources). Predictions/bets cover BOTH tours; our_prob = the
# vig-free market (P3 proved no edge over the moneyline — tennis-moneyline-no-edge).

on:
  schedule:
    - cron: "0 */6 * * *"   # odds + predictions + settle (accountability-only; see header)
    - cron: "0 6 * * 1"     # weekly: rebuild player ratings (both tours)
  workflow_dispatch:
    inputs:
      date:
        description: "Match date YYYY-MM-DD (UTC). Default: all upcoming"
        required: false
        type: string
      rebuild_ratings:
        description: "Force-rebuild ATP ratings from match history"
        required: false
        type: boolean
        default: false
      debug_thesportsdb:
        description: "Dump raw TheSportsDB events instead of settling (diagnostic, no DB writes)"
        required: false
        type: boolean
        default: false

concurrency:
  group: refresh-tennis
  cancel-in-progress: false

jobs:
  refresh-tennis:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY || '123' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API: ${{ secrets.KAGGLE_API }}
        run: |
          if [ -n "$KAGGLE_API" ]; then
            mkdir -p ~/.kaggle
            echo '{"username":"JosBAN","key":"'"$KAGGLE_API"'"}' > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          fi

      - name: Rebuild ATP ratings (weekly or on demand)
        if: github.event.schedule == '0 6 * * 1' || inputs.rebuild_ratings == true
        run: python -m ingest.tennis_history

      - name: Settle completed bets from tennis-data.co.uk results
        # Free results source (ATP+WTA, set/game scores). Updates near-daily during
        # a Slam but lags a few days for smaller events. continue-on-error so a
        # flaky download never blocks the odds + recommendations refresh below.
        continue-on-error: true
        run: python -m ingest.tennis_results

      - name: Settle remaining bets from TheSportsDB (fallback)
        # tennis-data.co.uk has stalled mid-Slam before (Wimbledon 2026: no update
        # for 6+ days). TheSportsDB has full ATP/WTA event coverage as a backup —
        # no serve stats, but settlement only needs winner + sets. Only touches
        # matches the step above left unresolved; never overwrites tennis-data's
        # richer per-set data once it lands.
        if: inputs.debug_thesportsdb != true
        continue-on-error: true
        run: python -m ingest.tennis_results_thesportsdb

      - name: Debug — dump raw TheSportsDB events (no DB writes)
        if: inputs.debug_thesportsdb == true
        run: python -m ingest.tennis_results_thesportsdb --debug

      - name: Refresh Wimbledon odds (both tours)
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m ingest.tennis_schedule --date "${{ inputs.date }}"
          else
            python -m ingest.tennis_schedule
          fi

      - name: Scan + settle sharp line alerts (tennis)
        run: python -m model.line_alerts --sport tennis

      - name: Write model predictions (ATP grass-Elo, market-anchored)
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m model.tennis_predictions --date "${{ inputs.date }}"
          else
            python -m model.tennis_predictions
          fi

      - name: Rate moneyline bets
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m model.tennis_bets --date "${{ inputs.date }}"
          else
            python -m model.tennis_bets
          fi
