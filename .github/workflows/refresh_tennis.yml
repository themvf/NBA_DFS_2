name: Refresh Tennis

# Refresh odds → write predictions → rate moneyline bets. Cadence is
# ACCOUNTABILITY-ONLY — P3 proved the market is sharp / no edge, so we sample the
# closing line to keep the ledger + backtest honest, not to chase a bet. The 2026
# US Open window (Aug 24–Sep 13) runs every 3h; the rest of the calendar stays 6h
# to avoid permanently doubling Odds API consumption.
# Result settlement is isolated in refresh_tennis_settlement.yml (15-minute
# cadence). Both workflows share one concurrency group, while PostgreSQL row
# locks and idempotent resolutions provide the actual correctness guarantee.
# Weekly (Mon 05:00 UTC): rebuild grass-Elo ratings for BOTH tours — ATP from
# TML-Database (with serve stats), WTA from tennis-data.co.uk (results only) —
# folding completed results back into player strength (see memory
# tennis-data-sources). Predictions/bets cover BOTH tours; our_prob = the
# vig-free market (P3 proved no edge over the moneyline — tennis-moneyline-no-edge).

on:
  schedule:
    # Normal 6h cadence, except during the fixed 2026 US Open window below.
    - cron: "0 */6 * 1-7,10-12 *"
    - cron: "0 */6 1-23 8 *"
    - cron: "0 */3 24-31 8 *"  # US Open: Aug 24–31, 2026
    - cron: "0 */3 1-13 9 *"   # US Open: Sep 1–13, 2026
    - cron: "0 */6 14-30 9 *"
    - cron: "0 5 * * 1"        # weekly: rebuild player ratings (both tours)
  workflow_dispatch:
    inputs:
      date:
        description: "Match date YYYY-MM-DD (UTC). Default: all upcoming"
        required: false
        type: string
      rebuild_ratings:
        description: "Force-rebuild ATP ratings from match history"
        required: false
        type: boolean
        default: false
      debug_thesportsdb:
        description: "Dump raw TheSportsDB events instead of settling (diagnostic, no DB writes)"
        required: false
        type: boolean
        default: false
      debug_discovery:
        description: "Dump every Odds API /v4/sports entry mentioning tennis, unfiltered (diagnostic, no DB writes)"
        required: false
        type: boolean
        default: false

concurrency:
  group: tennis-pipeline
  cancel-in-progress: false

jobs:
  refresh-tennis:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY || '123' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API: ${{ secrets.KAGGLE_API }}
        run: |
          if [ -n "$KAGGLE_API" ]; then
            mkdir -p ~/.kaggle
            echo '{"username":"JosBAN","key":"'"$KAGGLE_API"'"}' > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          fi

      - name: Rebuild ATP ratings (weekly or on demand)
        if: github.event.schedule == '0 5 * * 1' || inputs.rebuild_ratings == true
        run: python -m ingest.tennis_history

      # Settlement runs only in refresh_tennis_settlement.yml. Both workflows
      # share the tennis-pipeline concurrency group; PostgreSQL row locks and
      # idempotency remain the correctness boundary.

      - name: Debug — dump raw TheSportsDB events (no DB writes)
        if: inputs.debug_thesportsdb == true
        run: python -m ingest.tennis_results_thesportsdb --debug

      - name: Capture Polymarket tennis match prices
        continue-on-error: true
        run: python -m ingest.polymarket_tennis --matches-only

      - name: Capture Polymarket tennis futures (weekly)
        if: github.event.schedule == '0 5 * * 1' || inputs.rebuild_ratings == true
        continue-on-error: true
        run: python -m ingest.polymarket_tennis --futures-only

      - name: Debug — dump raw Odds API tennis discovery (no DB writes)
        if: inputs.debug_discovery == true
        run: python -m ingest.tennis_schedule --debug-discovery

      - name: Refresh provider-covered Tennis odds (both tours)
        if: inputs.debug_discovery != true
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m ingest.tennis_schedule --date "${{ inputs.date }}"
          else
            python -m ingest.tennis_schedule
          fi

      - name: Scan + settle sharp line alerts (tennis)
        run: python -m model.line_alerts --sport tennis --existing-schema

      - name: Write model predictions (ATP grass-Elo, market-anchored)
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m model.tennis_predictions --date "${{ inputs.date }}"
          else
            python -m model.tennis_predictions
          fi

      - name: Rate moneyline bets
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m model.tennis_bets --date "${{ inputs.date }}"
          else
            python -m model.tennis_bets
          fi

      - name: US Open draw and metadata readiness gate
        if: inputs.debug_discovery != true
        run: python -m ingest.tennis_us_open_preflight --enrich --fail-on-unready
