name: Tennis Settlement (frequent)

# Settlement-only, decoupled from refresh_tennis.yml's 6h odds/predictions
# cycle so the ledger doesn't wait on that cadence. tennisexplorer.com is free
# (no API key, no Odds-API credit cost) and carries same-day Wimbledon
# results — verified 2026-07-04 (settled 130 of 166 pending bets correctly on
# first run, after tennis-data.co.uk stalled 6+ days into the tournament and
# TheSportsDB turned out to have zero Wimbledon events in its feed at all).
# The same poll also runs the quota-aware sportsbook checkpoint guard; it makes
# a paid request only when an upcoming US Open match is missing open/T-6h/
# T-90m/T-20m evidence. Runs all three result providers every 15 min. Individual sources remain
# best-effort, but every observation is immutable and accepted resolutions
# publish match + moneyline state in one row-locked transaction. The final
# reconciliation gate exposes all-provider failure, stale results, disputes,
# and ledger invariant violations.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: tennis-pipeline
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY || '123' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Closing-line fallback poll (MLB + Tennis)
        run: python -m ingest.event_closing_lines --existing-schema

      - name: Capture due US Open sportsbook checkpoints
        run: python -m ingest.tennis_capture_checkpoints --existing-schema

      - name: Detect and grade Tennis market signals
        run: python -m model.line_alerts --sport tennis --existing-schema

      - name: Settle from tennisexplorer.com (same-day results, primary)
        continue-on-error: true
        run: python -m ingest.tennis_results_tennisexplorer --existing-schema

      - name: Settle from tennis-data.co.uk (richer per-set data, when current)
        continue-on-error: true
        run: python -m ingest.tennis_results

      - name: Settle from TheSportsDB (fallback)
        continue-on-error: true
        run: python -m ingest.tennis_results_thesportsdb

      - name: Reconcile and gate Tennis settlement health
        run: python -m ingest.tennis_reconciliation --fail-on-unhealthy

      - name: Report prospective WTA walking study (read-only)
        if: always()
        run: python -m model.tennis_walking_study
