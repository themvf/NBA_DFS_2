name: Refresh MLB Vegas

on:
  schedule:
    # 9:10 AM ET (13:10 UTC, DST) — full refresh: today's slate + rolling
    # historical catch-up (schedule, scores, odds) + open-line bet snapshot.
    - cron: "10 13 * * *"
    # Intra-day CLV passes — re-fetch odds + re-rate the still-unlocked slate so
    # each bet accumulates open→close snapshots before first pitch (Closing Line
    # Value needs ≥2 snapshots/bet). These skip the historical backfill (days_back=0).
    # ~1:10 PM ET (close for afternoon games) and ~6:10 PM ET (close for night games).
    - cron: "10 17 * * *"
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target MLB game date YYYY-MM-DD (default: current America/New_York date)"
        required: false
        type: string
      days_back:
        description: "Rolling historical backfill window ending yesterday"
        required: false
        default: "7"
        type: string

concurrency:
  group: refresh-mlb-vegas
  cancel-in-progress: false

jobs:
  refresh-mlb-vegas:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve MLB refresh inputs
        shell: bash
        run: |
          TARGET_DATE="${{ inputs.date }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE="$(TZ=America/New_York date +%F)"
          fi

          # The morning cron (and manual dispatch) does the full historical
          # catch-up; the intra-day CLV passes only need today's odds + a fresh
          # bet snapshot, so they skip the rolling backfill (days_back=0).
          SCHED="${{ github.event.schedule }}"
          if [ -n "$SCHED" ] && [ "$SCHED" != "10 13 * * *" ]; then
            DAYS_BACK="0"
          else
            DAYS_BACK="${{ inputs.days_back }}"
            if [ -z "$DAYS_BACK" ]; then
              DAYS_BACK="7"
            fi
          fi

          echo "MLB_REFRESH_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
          echo "MLB_REFRESH_DAYS_BACK=$DAYS_BACK" >> "$GITHUB_ENV"
          echo "Using target date $TARGET_DATE with days_back=$DAYS_BACK"

      - name: Refresh MLB Vegas schedule, scores, and odds
        run: |
          python -m ingest.refresh_mlb_vegas \
            --date "$MLB_REFRESH_DATE" \
            --days-back "$MLB_REFRESH_DAYS_BACK"
