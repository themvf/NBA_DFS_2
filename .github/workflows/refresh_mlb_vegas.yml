name: Refresh MLB Vegas

on:
  schedule:
    # 9:10 AM ET (13:10 UTC, DST) — full refresh: today's slate + rolling
    # historical catch-up (schedule, scores, odds) + open-line bet snapshot.
    - cron: "10 13 * * *"
    # Intra-day CLV passes — re-fetch odds + re-rate the still-unlocked slate so
    # each bet accumulates open→close snapshots before first pitch (Closing Line
    # Value needs ≥2 snapshots/bet). These skip the historical backfill (days_back=0).
    # ~1:10 PM ET (close for afternoon games) and ~6:10 PM ET (close for night games).
    - cron: "10 17 * * *"
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target MLB game date YYYY-MM-DD (default: current America/New_York date)"
        required: false
        type: string
      days_back:
        description: "Rolling historical backfill window ending yesterday"
        required: false
        default: "7"
        type: string
      run_props:
        description: "Also capture player-prop odds (PAUSED on schedule since 2026-08-24 — Odds API quota)"
        required: false
        type: boolean
        default: false

concurrency:
  group: refresh-mlb-vegas
  cancel-in-progress: false

jobs:
  refresh-mlb-vegas:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve MLB refresh inputs
        shell: bash
        run: |
          TARGET_DATE="${{ inputs.date }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE="$(TZ=America/New_York date +%F)"
          fi

          # The morning cron (and manual dispatch) does the full historical
          # catch-up; the intra-day CLV passes only need today's odds + a fresh
          # bet snapshot, so they skip the rolling backfill (days_back=0).
          SCHED="${{ github.event.schedule }}"
          if [ -n "$SCHED" ] && [ "$SCHED" != "10 13 * * *" ]; then
            DAYS_BACK="0"
          else
            DAYS_BACK="${{ inputs.days_back }}"
            if [ -z "$DAYS_BACK" ]; then
              DAYS_BACK="7"
            fi
          fi

          echo "MLB_REFRESH_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
          echo "MLB_REFRESH_DAYS_BACK=$DAYS_BACK" >> "$GITHUB_ENV"
          echo "Using target date $TARGET_DATE with days_back=$DAYS_BACK"

      - name: Refresh MLB Vegas schedule, scores, and odds
        run: |
          python -m ingest.refresh_mlb_vegas \
            --date "$MLB_REFRESH_DATE" \
            --days-back "$MLB_REFRESH_DAYS_BACK"

      - name: Capture MLB player-prop odds (4 anchored markets, 10 books)
        # Per-event calls. Cost = markets × ceil(books/10), so 4 credits/event
        # here — books are free to 10, the 11th doubles it. 3x/day, never on
        # the 30-min game-line cadence. Only the 4 markets with a same-line
        # Pinnacle anchor are funded; the rest cannot produce a verdict.
        #
        # PAUSED ON THE SCHEDULE 2026-08-24. The shared ODDS_API_KEY hit its
        # 20,000/month ceiling (remaining=0 used=20000), so every paid /odds
        # call — MLB, NFL and tennis alike — was returning 401 Unauthorized
        # and writing nothing. Prop capture is the largest discretionary
        # consumer here (~4 credits/event × ~15 events × 3 runs/day ≈ 180/day,
        # ~5,400/30d), so it yields first to keep game-line capture — which the
        # bet ledger, CLV and line-alert detectors all depend on — funded.
        #
        # CONSEQUENCE, recorded rather than glossed: this halts accrual for the
        # pre-registered `mlb-prop-program-v1` cohort (verdict 2026-10-04;
        # conjunctive floors n_eff>=134, >=25 distinct dates, >=30 settled).
        # That program forbids stopping for efficacy — this is an
        # infrastructure halt, not an efficacy decision, and it must be carried
        # into the eventual verdict as a cadence change, per the standing rule
        # that a cadence change is a NEW program version and never a silent
        # continuation of the old one. Note the cohort was already accruing
        # nothing while the quota sat at zero; this makes that explicit.
        #
        # To resume: dispatch manually with run_props=true, or delete this
        # `if:` once there is quota headroom again.
        if: inputs.run_props == true
        run: python -m ingest.mlb_prop_odds

      - name: Scan + settle sharp line alerts (game lines + props)
        run: python -m model.line_alerts --sport mlb

      - name: MLB prop-value program status (pre-registered, read-only)
        # Reports accrual against the frozen floors. Withholds any rate,
        # interval or verdict below floor — raw counts only. Never fails the
        # workflow: it is a report, not a gate.
        continue-on-error: true
        run: python -m model.mlb_prop_program
