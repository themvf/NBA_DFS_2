name: Settle MLB Terminal Signals

on:
  schedule:
    # Includes late West Coast finishes. Free scores + stored-quote grading only.
    # The hourly cadence comes from /api/cron/dispatch (job mlb-terminal-settlement):
    # GitHub started the old every-30-minutes schedule only every 4-6 hours. This is
    # the thin fallback in case the Vercel bridge breaks.
    - cron: "47 */6 * 3-11 *"
  workflow_dispatch:

concurrency:
  group: mlb-terminal-settlement
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh MLB final scores and grade recorded signals
        run: python -m ingest.mlb_terminal_settlement
