name: Refresh NFL PBP Archetypes

# Populates `nfl_pbp_archetypes`, which backs the PBP Archetype tab on /nfl.
# Without this the tab deploys correctly and shows an empty state, because the
# table is created by schema init but never written to.
#
# Two scheduled slots, both self-healing (--relabel-stale), chosen against
# nflverse's publish cadence (the pbp release is rebuilt each morning during
# the season):
#   Monday 12:00 UTC  = 08:00 ET in daylight time -- picks up Thursday +
#                       Sunday games the morning after the Sunday slate.
#   Tuesday 14:00 UTC = fallback after Monday night's game has been published.
# Cron is UTC, so the Monday slot drifts to 07:00 ET once clocks fall back;
# nflverse has already published by then, so that is harmless.

on:
  # A labeller change relabels the table on merge. Without this, a version
  # bump left the stored rows on the old labelling until the weekly cron,
  # while the web deploy went out immediately -- a window where the page
  # expected columns the data did not have yet. The relabel is driven by what
  # the table says is stale, so this trigger needs no season list.
  push:
    branches: [main]
    paths:
      - "model/nfl_play_archetypes.py"
      - "model/nfl_drive_archetypes.py"
      - "model/nfl_participation.py"
      - "model/nfl_play_facts.py"
      - "model/nfl_context_engine.py"
      - "model/nfl_context_measures.py"
      - "ingest/nfl_pbp_archetypes.py"
      - "ingest/nfl_season_schedule.py"
      - "ingest/nfl_context_publish.py"

  workflow_dispatch:
    inputs:
      mode:
        description: "stale = pick up whatever the release now carries (self-healing); season = rebuild a whole season/game"
        required: false
        default: "stale"
        type: choice
        options:
          - stale
          - season
      season:
        description: "Season to rebuild (e.g. 2026). Blank = self-healing --relabel-stale, same as the scheduled runs."
        required: false
        default: ""
      game:
        description: "Optional game_id substring (e.g. NE_SEA), season mode only. Blank = whole season."
        required: false
        default: ""
  schedule:
    - cron: "0 12 * * 1"
    - cron: "0 14 * * 2"   # fallback after the 13:07 UTC dispatch; MNF data lands ~11:34 UTC

concurrency:
  group: nfl-pbp-archetypes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The labellers read nflverse's parquet release directly.
          pip install "pandas>=2" "pyarrow>=15"

      # Team Identity requires final scores and the canonical odds bridge as
      # well as labelled plays. Refresh these before deciding which games are
      # stale, so every team's postgame comparison advances with the release.
      - name: Refresh current-season schedule and final scores
        run: |
          SEASON=$(python -c "from datetime import datetime, timezone; from ingest.nfl_dfs_weekly import target_season; print(target_season(None, datetime.now(timezone.utc)))")
          python -m ingest.nfl_season_schedule --season "$SEASON"

      # Relabel only what disagrees with the release: a stale labeller version
      # or a game played since the last run. Pushes, both scheduled slots, and
      # a manual dispatch with no season all take this path, so an unrelated
      # edit or a quiet week is a cheap no-op rather than a full rebuild.
      - name: Relabel stale and newly-played games
        if: github.event_name != 'workflow_dispatch' || inputs.season == ''
        run: python -m ingest.nfl_pbp_archetypes --relabel-stale

      # A deliberate rebuild of a whole season or one game: only a manual
      # dispatch that named a season.
      - name: Rebuild a season or game
        if: github.event_name == 'workflow_dispatch' && inputs.season != ''
        run: |
          if [ -n "${{ inputs.game }}" ]; then
            python -m ingest.nfl_pbp_archetypes --season "${{ inputs.season }}" --game "${{ inputs.game }}"
          else
            python -m ingest.nfl_pbp_archetypes --season "${{ inputs.season }}"
          fi

      # The context engine owns a separate append-only fact ledger. Publishing
      # it here keeps the canonical facts current without coupling their
      # revision lifecycle to the replace-in-place archetype presentation table.
      - name: Publish revisioned play facts
        shell: bash
        run: |
          SEASON="${{ inputs.season }}"
          if [ -z "$SEASON" ]; then
            SEASON=$(python -c "from datetime import datetime,timezone; n=datetime.now(timezone.utc); print(n.year-1 if n.month<=3 else n.year)")
          fi
          SOURCE="/tmp/play_by_play_${SEASON}.parquet"
          curl --fail --location --retry 3 \
            "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${SEASON}.parquet" \
            --output "$SOURCE"
          python -m ingest.nfl_context_publish "$SOURCE" --season-type REG --apply

          HISTORY_SEASON=$((SEASON - 1))
          HISTORY_SOURCE="/tmp/play_by_play_${HISTORY_SEASON}.parquet"
          curl --fail --location --retry 3 \
            "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${HISTORY_SEASON}.parquet" \
            --output "$HISTORY_SOURCE"
          python -m ingest.nfl_context_game_snapshots "$HISTORY_SOURCE" \
            --season "$SEASON" --apply
